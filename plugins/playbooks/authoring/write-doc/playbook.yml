# write-doc — 資料を1本書いて保存する。
#
# **この playbook は個々の手順を知らない。** 何を、どの順で呼ぶかだけを持つ。
# 順番を変えたい・工程を差し替えたいときは、
# <repo>/.harness-plugins/write-doc.config.yml で上書きする。
version: 2
name: write-doc
description: 資料を1本書いて保存する
instructions:
  execution:
    directive: stepsを上から順に実行し、needsを前工程のprovidesから受け取る
  config:
    directive: 各工程の解決済みYAMLファイルから必要なinstructionsをプロパティアクセスで読む

# 欠けていたら止める。黙って劣化した結果を出さない。
requires:
  - {plugin: content-types, marketplace: write-doc}
  - {plugin: writing-rules, marketplace: write-doc}
  - {plugin: visual-guidance, marketplace: write-doc}
  - {plugin: doc-render, marketplace: write-doc}
  - {plugin: review-doc, marketplace: write-doc}

# 下段どうしをつなぐ契約。playbook が持つ。
contract:
  roles: [要点, キーワード, 一言でいうと, 要約項目]
  figure_roles: [図の主張, 図の型, 図の内容]
  figure_requirement: figures_required
  save_modes: [create, replace-existing-target]
  output_format_precedence: [caller, doc-render]
  output_formats: [markdown, html]

# 図の採用は読み手の理解に役立つかで決める。
# 明示的に最低1つ必要な場合は requirements.figures: true を指定する。
requirements:
  figures: false

# stepsは上から実行する。skill/script/playbookは呼ぶ処理、needsは開始条件、
# providesは完了時に登録する成果物。completionは完了判定、on_failureは失敗時の遷移。
steps:
  - id: type
    skill: pick-content-type
    purpose: 読み手の前提と読後の到達点を記録し、型と骨格を取る
    provides: [type, template, reader_context]
    file_artifacts: [reader_context]
    completion: artifact-set
    on_failure: stop

  - id: draft
    skill: write-with-rules
    purpose: 読み手の理解の順序を設計して本文を書き、本文だけで到達点を満たせるか検証する
    needs: [type, template, reader_context]
    provides: [body, roles_applied, reader_review]
    file_artifacts: [reader_review]
    completion: artifact-set
    on_failure: stop

  - id: visual
    skill: choose-visual
    purpose: 主要な主張に合う図を設計する
    needs: [body]
    provides: [figures_applied]
    completion: artifact-set
    on_failure: stop

  - id: save
    plugin: doc-render
    script: scripts/write-doc.sh
    purpose: 役を媒体の表現へ写し、上書きを防いで保存する
    needs: [body, roles_applied, figures_applied, reader_review]
    provides: [path]
    completion: artifact-set
    on_failure: stop

  - id: review
    skill: review-doc
    purpose: 保存した完成文書を基準に照らして評価し、必要な修正後に読み直す
    needs: [path, type, reader_context, reader_review]
    provides: [document_review]
    file_artifacts: [document_review]
    completion: artifact-set
    on_failure: stop
