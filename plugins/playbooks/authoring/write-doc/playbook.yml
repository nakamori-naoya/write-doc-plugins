version: 2
name: write-doc
description: 素材からMarkdown資料を1本書いて保存する
instructions:
  execution:
    directive: 契約入力をauthor-documentへ渡し、返されたstatusとpathまたはreasonをそのまま返す

requires:
  - {plugin: author-document, marketplace: write-doc}

steps:
  - id: author
    skill: author-document
    purpose: 読み手と目的を固定し、Markdown資料を直接執筆して保存する
    provides: [status, path, reason]
