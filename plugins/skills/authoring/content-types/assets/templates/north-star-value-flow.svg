<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="500" viewBox="0 0 1500 500" role="img" aria-labelledby="title desc">
  <title id="title">対象から望む状態まで価値が届く流れ</title>
  <desc id="desc">価値を受け取る人、現在損なわれている価値、プロダクトの役割、約束する価値、望む状態のつながりを示すテンプレート図。</desc>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f7f8fa;
      --text: #172033;
      --arrow: #53627a;
      --actor: #2f579c;
      --actor-soft: #edf2ff;
      --loss: #8b321f;
      --loss-soft: #fff0ed;
      --role: #7c520c;
      --role-soft: #fff7e6;
      --value: #155d39;
      --value-soft: #e8f5ee;
      --anchor: #172033;
      --anchor-text: #ffffff;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #101827;
        --text: #edf2f7;
        --arrow: #bdc8d8;
        --actor: #93b4f5;
        --actor-soft: #1b2b4d;
        --loss: #fca5a5;
        --loss-soft: #40201c;
        --role: #f5c86b;
        --role-soft: #3b2f14;
        --value: #34d399;
        --value-soft: #123a2a;
        --anchor: #e2e8f0;
        --anchor-text: #101827;
      }
    }
    text { font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif; fill: var(--text); }
    .heading { font-size: 30px; font-weight: 700; }
    .node-title { font-size: 24px; font-weight: 700; }
    .body { font-size: 19px; }
    .anchor-text { font-size: 21px; font-weight: 700; fill: var(--anchor-text); }
    .arrow-head { fill: var(--arrow); }
  </style>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path class="arrow-head" d="M0 0L12 6L0 12Z" fill="#53627a"/>
    </marker>
  </defs>

  <rect width="1500" height="500" rx="28" fill="var(--bg)"/>
  <text x="750" y="62" text-anchor="middle" class="heading">North Starは、対象者へ価値が届く因果を示す</text>

  <g text-anchor="middle">
    <rect x="45" y="145" width="250" height="170" rx="20" fill="var(--actor-soft)" stroke="var(--actor)" stroke-width="3"/>
    <text x="170" y="198" class="node-title" fill="var(--actor)">対象</text>
    <text x="170" y="250" class="body">〈価値を受け取る人〉</text>

    <rect x="335" y="145" width="250" height="170" rx="20" fill="var(--loss-soft)" stroke="var(--loss)" stroke-width="3"/>
    <text x="460" y="198" class="node-title" fill="var(--loss)">損なわれた状態</text>
    <text x="460" y="250" class="body">〈現在の不利益〉</text>

    <rect x="625" y="145" width="250" height="170" rx="20" fill="var(--role-soft)" stroke="var(--role)" stroke-width="3"/>
    <text x="750" y="198" class="node-title" fill="var(--role)">プロダクトの役割</text>
    <text x="750" y="250" class="body">〈固有に担うこと〉</text>

    <rect x="915" y="145" width="250" height="170" rx="20" fill="var(--value-soft)" stroke="var(--value)" stroke-width="3"/>
    <text x="1040" y="198" class="node-title" fill="var(--value)">約束する価値</text>
    <text x="1040" y="250" class="body">〈対象者の進歩〉</text>

    <rect x="1205" y="145" width="250" height="170" rx="20" fill="var(--value-soft)" stroke="var(--value)" stroke-width="3"/>
    <text x="1330" y="198" class="node-title" fill="var(--value)">望む状態</text>
    <text x="1330" y="250" class="body">〈実現したい未来〉</text>
  </g>

  <path d="M295 230H322" stroke="var(--arrow)" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M585 230H612" stroke="var(--arrow)" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M875 230H902" stroke="var(--arrow)" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M1165 230H1192" stroke="var(--arrow)" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="300" y="375" width="900" height="64" rx="32" fill="var(--anchor)"/>
  <text x="750" y="416" text-anchor="middle" class="anchor-text">〈手段が変わっても残る価値のつながり〉</text>
</svg>
