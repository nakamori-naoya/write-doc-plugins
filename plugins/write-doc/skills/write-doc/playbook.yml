# write-doc — 素材からMarkdown資料を1本書いて保存する。
# 外に約束する入力、出力、保証は CONTRACT.md が決める。工程の順番はこの file が決め、
# すべての工程を同じ agent が同じ文脈で進める。工程の間で受け渡す値は無く、並びの順だけが前後の関係である。
version: 2
name: write-doc
description: 素材からMarkdown資料を1本書いて保存する
inputs: [material, document_type, output_directory, update_target, name, references]
requires: []

steps:
  - id: check-input
    agent_work: invoking_agent
    purpose: 入力と保存先を確かめ、すべて通るまで file を作らない
    needs: [material, document_type, output_directory, update_target, name, references]

  - id: fix-reader
    agent_work: invoking_agent
    purpose: 書くときの規範を読み、主な読み手と、読んだ後の判断か行動を一つずつ決める

  - id: choose-type
    agent_work: invoking_agent
    purpose: 型の一覧から template と見本を引き、最終版の資産の保存先を決める

  - id: outline
    agent_work: invoking_agent
    purpose: 主メッセージを一文で書き、見出しだけの骨組みを順に読んで話が通るかを確かめる

  - id: draft
    agent_work: invoking_agent
    purpose: 本文、表、図の受け持ちを分けて、Markdown を手元で組み立てる

  - id: self-edit
    agent_work: invoking_agent
    purpose: 冒頭、削り方、事実と素材の突き合わせ、骨組みの通読の四つを確かめ、欠ければ草稿へ戻る

  - id: save
    agent_work: invoking_agent
    purpose: 最終版の資産と Markdown を保存し、読み直してから結果を返す
    provides: [status, path, reason]
