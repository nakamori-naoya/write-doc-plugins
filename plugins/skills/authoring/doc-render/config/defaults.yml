# output: 出力形式（markdown固定）と保存先。dirはtypeで相対・絶対を明示する。
# instructions: 描画規則。
version: 2
output:
  format: markdown
  default: {dir: {type: relative, path: docs}}
  # 選択された文書型ごとの保存先。未指定の型はdefaultへ保存する。
  # relativeは作業repository基準、absoluteは ~/ または / で始まるpath。
  routes: []
instructions:
  render:
    directive: references/markdown.md の対応表で、受け取った意味上の役を媒体表現へ写す
