<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">基本方針で選ぶことと選ばないこと</title>
  <desc id="desc">診断した最重要課題に対し、資源を集中する対象と、いまは選ばない対象の境界を示すテンプレート図。</desc>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f7f8fa;
      --text: #172033;
      --muted: #435066;
      --line: #9aa3b2;
      --chosen: #155d39;
      --chosen-strong: #247a4b;
      --chosen-soft: #e8f5ee;
      --deferred: #4c5565;
      --deferred-strong: #697386;
      --deferred-soft: #f1f2f4;
      --anchor: #172033;
      --anchor-text: #ffffff;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #101827;
        --text: #edf2f7;
        --muted: #bdc8d8;
        --line: #445169;
        --chosen: #34d399;
        --chosen-strong: #34d399;
        --chosen-soft: #123a2a;
        --deferred: #9aa5bb;
        --deferred-strong: #9aa5bb;
        --deferred-soft: #222c3f;
        --anchor: #e2e8f0;
        --anchor-text: #101827;
      }
    }
    text { font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif; fill: var(--text); }
    .heading { font-size: 30px; font-weight: 700; }
    .panel-title { font-size: 27px; font-weight: 700; }
    .body { font-size: 23px; }
    .note { font-size: 21px; fill: var(--muted); }
    .small { font-size: 19px; }
    .anchor-text { font-size: 22px; font-weight: 700; fill: var(--anchor-text); }
  </style>

  <rect width="1200" height="520" rx="28" fill="var(--bg)"/>
  <text x="600" y="62" text-anchor="middle" class="heading">基本方針がつくる選択の境界</text>

  <rect x="78" y="112" width="470" height="270" rx="22" fill="var(--chosen-soft)" stroke="var(--chosen-strong)" stroke-width="3"/>
  <text x="313" y="163" text-anchor="middle" class="panel-title" fill="var(--chosen)">選ぶこと</text>
  <text x="313" y="218" text-anchor="middle" class="body">〈最重要課題へ効く集中先〉</text>
  <text x="313" y="263" text-anchor="middle" class="note">活かす強み・変える制約</text>
  <text x="313" y="320" text-anchor="middle" class="small" fill="var(--chosen-strong)">ここへ資源と判断を揃える</text>

  <rect x="652" y="112" width="470" height="270" rx="22" fill="var(--deferred-soft)" stroke="var(--deferred-strong)" stroke-width="3"/>
  <text x="887" y="163" text-anchor="middle" class="panel-title" fill="var(--deferred)">いまは選ばないこと</text>
  <text x="887" y="218" text-anchor="middle" class="body">〈魅力的でも後回しにする対象〉</text>
  <text x="887" y="263" text-anchor="middle" class="note">受け入れる制約・捨てる選択肢</text>
  <text x="887" y="320" text-anchor="middle" class="small" fill="var(--deferred-strong)">集中を守るため境界を明示する</text>

  <path d="M548 247H652" stroke="var(--line)" stroke-width="3" stroke-dasharray="8 8"/>

  <rect x="250" y="420" width="700" height="62" rx="31" fill="var(--anchor)"/>
  <text x="600" y="460" text-anchor="middle" class="anchor-text">〈この境界によって可能になる一貫した行動〉</text>
</svg>
