<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">基本方針で選ぶことと選ばないこと</title>
  <desc id="desc">診断した最重要課題に対し、資源を集中する対象と、いまは選ばない対象の境界を示すテンプレート図。</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif; fill: #172033; }
    .heading { font-size: 30px; font-weight: 700; }
    .panel-title { font-size: 27px; font-weight: 700; }
    .body { font-size: 23px; }
    .note { font-size: 21px; fill: #435066; }
    .small { font-size: 19px; }
    .anchor-text { font-size: 22px; font-weight: 700; fill: #ffffff; }
  </style>

  <rect width="1200" height="520" rx="28" fill="#f7f8fa"/>
  <text x="600" y="62" text-anchor="middle" class="heading">基本方針がつくる選択の境界</text>

  <rect x="78" y="112" width="470" height="270" rx="22" fill="#e8f5ee" stroke="#247a4b" stroke-width="3"/>
  <text x="313" y="163" text-anchor="middle" class="panel-title" fill="#155d39">選ぶこと</text>
  <text x="313" y="218" text-anchor="middle" class="body">〈最重要課題へ効く集中先〉</text>
  <text x="313" y="263" text-anchor="middle" class="note">活かす強み・変える制約</text>
  <text x="313" y="320" text-anchor="middle" class="small" fill="#247a4b">ここへ資源と判断を揃える</text>

  <rect x="652" y="112" width="470" height="270" rx="22" fill="#f1f2f4" stroke="#697386" stroke-width="3"/>
  <text x="887" y="163" text-anchor="middle" class="panel-title" fill="#4c5565">いまは選ばないこと</text>
  <text x="887" y="218" text-anchor="middle" class="body">〈魅力的でも後回しにする対象〉</text>
  <text x="887" y="263" text-anchor="middle" class="note">受け入れる制約・捨てる選択肢</text>
  <text x="887" y="320" text-anchor="middle" class="small" fill="#697386">集中を守るため境界を明示する</text>

  <path d="M548 247H652" stroke="#9aa3b2" stroke-width="3" stroke-dasharray="8 8"/>

  <rect x="250" y="420" width="700" height="62" rx="31" fill="#172033"/>
  <text x="600" y="460" text-anchor="middle" class="anchor-text">〈この境界によって可能になる一貫した行動〉</text>
</svg>
